<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Juan Carlos Barba Fernández y Tamara Fernández Viturro">
    <link rel="icon" type="image/x-icon" href="./img/icon.png">
    <title>Web's title</title>
    <link rel="stylesheet" href="./style/main.css">
    <script type="module" src="./script/app.js"></script>
</head>
<body>
    <header class="web-header">

    </header>
    <main class="web-header">
        <div class="modal-container">

            <div class="modal">
                <div class="modal-header">
                    <div class="icon-container">
                        <svg class="icon-svg" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M247 128C249.209 128 251 129.791 251 132V270H340C342.209 270 344 271.791 344 274V306C344 308.209 342.209 310 340 310H215C212.86 310 211.112 308.319 211.005 306.206C211.001 306.138 211 306.069 211 306V132C211 129.791 212.791 128 215 128H247Z" fill="#D9D9D9"/>
                            <path d="M250 17C309.59 17 363.955 39.3709 405.156 76.1719L360.396 120.723C330.694 95.3337 292.138 80 250 80C156.112 80 80 156.112 80 250C80 343.888 156.112 420 250 420C289.099 420 325.114 406.798 353.834 384.612L398.765 429.333C358.408 462.848 306.558 483 250 483C121.318 483 17 378.682 17 250C17 121.318 121.318 17 250 17Z" fill="#D9D9D9"/>
                            <path d="M440.3 115.526C467.194 153.517 483 199.912 483 250C483 303.14 465.209 352.124 435.26 391.324L390.075 346.351C408.948 318.965 420 285.774 420 250C420 217.304 410.767 186.765 394.77 160.844L440.3 115.526Z" fill="#D9D9D9"/>
                        </svg>
                    </div>
                    <h1 class="header-title">WorkClock</h1>
                    <h2 class="header-subtitle">&nbsp;- Clock-in-out app</h2>
                </div>
                <div class="modal-main">
                    <div class="real-time-clock">
                        <div class="current-date-time-container">
                            <p class="current-time">14:36:00</p>
                            <p class="current-date">Lunes, 28 de septiembre 2026</p>
                        </div>
                    </div>
                    <div class="clock-in-out-form">
                        <label for="worker-input" class="worker-input-label">No. Empleado</label>
                        <input type="text" id="worker-input" class="worker-input" placeholder="AAA111111">
                        <button class="clock-in-out-button">Fichar entrada</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
